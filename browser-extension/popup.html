<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>EVA-Debrief</title>
<style>
  body {
    width: 280px;
    margin: 0;
    padding: 14px;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    color: #e8ecf5;
    background: #11151f;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 10px;
  }
  #status, #pushStatus {
    background: #1b2233;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 10px;
    line-height: 1.5;
    word-break: break-all;
  }
  button {
    width: 100%;
    padding: 8px;
    border: none;
    border-radius: 6px;
    background: #4f9dff;
    color: #0b0f18;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #linkStatus {
    margin-top: 8px;
    color: #9aa4b8;
    line-height: 1.5;
  }
  #permissionWarning {
    display: none;
    background: #3a1c22;
    border: 1px solid #ff5c69;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 10px;
    line-height: 1.5;
  }
  #permissionWarning button {
    margin-top: 8px;
    background: #ff5c69;
    color: #0b0f18;
  }
  #outdatedWarning {
    display: none;
    background: #3a2e10;
    border: 1px solid #e0a52e;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 10px;
    line-height: 1.5;
  }
  #outdatedWarning #outdatedVersions {
    display: block;
    color: #c9b78a;
    font-size: 12px;
    margin-top: 4px;
  }
  #outdatedWarning button {
    margin-top: 8px;
    background: #e0a52e;
    color: #0b0f18;
  }
  .nav-buttons {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .nav-buttons button {
    background: #232a3a;
    color: #e8ecf5;
    font-weight: 500;
  }
</style>
</head>
<body>
  <h1>EVA-Debrief — Collecteur</h1>
  <div id="permissionWarning">
    ⚠️ Le dernier envoi a échoué : "Accès aux sites" doit être sur <strong>"Sur tous les
    sites"</strong> ("Sur des sites spécifiques" ne suffit pas, même avec le bon domaine).
    <button id="openSiteAccessBtn">Corriger ("Accès aux sites")</button>
  </div>
  <div id="outdatedWarning">
    🔄 Cette extension n'est plus à jour — les imports sont mis en pause en attendant.
    <span id="outdatedVersions"></span>
    <button id="openUpdatePageBtn">Télécharger la dernière version</button>
  </div>
  <div id="status">Chargement…</div>
  <div id="pushStatus"></div>
  <button id="linkBtn">Lier ce compte EVA-Debrief</button>
  <div id="linkStatus"></div>
  <div class="nav-buttons">
    <button id="openProfileBtn">👤 Profil EVA</button>
    <button id="openHistoryBtn">📜 Historique EVA</button>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>

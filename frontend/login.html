<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>EVA Debrief — Connexion</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  :root{
    --bg:#0a0d14; --panel:#11151f; --panel-2:#161b28; --line:#232a3a;
    --text:#e7ebf3; --muted:#7c8598; --alliance:#4f9dff; --rebels:#ff7a45; --loss:#ff5c69;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #131a29 0%, transparent 45%),
      radial-gradient(circle at 100% 100%, #1a1120 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:38px 34px; width:320px; box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .mark{
    display:block;
    width:44px; height:44px; border-radius:8px; margin:0 auto 18px;
  }
  h1{
    font-family:'Segoe UI',system-ui,sans-serif; font-weight:700; font-size:17px;
    text-align:center; margin:0 0 4px; letter-spacing:0.05em; text-transform:uppercase;
  }
  p{color:var(--muted); font-size:12px; text-align:center; margin:0 0 24px;}
  input[type=password],input[type=text],input[type=email]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:11px 12px; font-size:14px; margin-bottom:14px;
  }
  input[type=password]:focus,input[type=text]:focus,input[type=email]:focus{outline:none; border-color:var(--alliance);}
  button{
    width:100%; background:var(--alliance); color:#0a0d14; border:none; border-radius:8px;
    padding:11px; font-weight:700; font-size:14px; cursor:pointer;
  }
  button:hover{filter:brightness(1.08);}
  button:disabled{opacity:0.6; cursor:default;}
  .error{color:var(--loss); font-size:12px; text-align:center; min-height:16px; margin-top:12px;}
  #turnstileContainer{display:none; margin-bottom:14px; justify-content:center;}
  .toggle-link{display:none; color:var(--alliance); font-size:12px; text-align:center; margin-top:16px; cursor:pointer;}
  .toggle-link:hover{text-decoration:underline;}
</style>
</head>
<body>
  <form class="card" id="loginForm" style="display:none;">
    <img class="mark" src="/logo.svg" alt="EVA Debrief">
    <h1>EVA Debrief</h1>
    <p id="loginIntro">Connecte-toi pour accéder au site</p>
    <input type="text" id="username" placeholder="Nom d'utilisateur" autocomplete="username">
    <input type="email" id="email" placeholder="Adresse email" autocomplete="email" style="display:none;">
    <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password">
    <input type="password" id="passwordConfirm" placeholder="Confirme le mot de passe" autocomplete="new-password" style="display:none;">
    <div id="turnstileContainer"></div>
    <button type="submit" id="loginBtn">Se connecter</button>
    <div class="error" id="loginError"></div>
    <div class="toggle-link" id="toggleModeLink"></div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    const introEl = document.getElementById('loginIntro');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('passwordConfirm');
    const turnstileContainer = document.getElementById('turnstileContainer');
    const toggleLink = document.getElementById('toggleModeLink');

    let mode = 'login'; // 'login' | 'setup' | 'register'
    let registrationEnabled = false;
    let turnstileSiteKey = null;
    let turnstileWidgetId = null;
    let turnstileScriptLoading = null;

    // Charge le script Turnstile une seule fois, seulement quand on en a besoin
    // (mode inscription) — inutile de l'imposer aux visiteurs qui se connectent.
    function ensureTurnstileLoaded() {
      if (window.turnstile) return Promise.resolve();
      if (turnstileScriptLoading) return turnstileScriptLoading;
      turnstileScriptLoading = new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
        s.async = true; s.defer = true;
        s.onload = () => resolve();
        document.head.appendChild(s);
      });
      return turnstileScriptLoading;
    }

    function idleButtonText() {
      if (mode === 'setup') return 'Créer le compte administrateur';
      if (mode === 'register') return 'Créer mon compte';
      return 'Se connecter';
    }

    // Affiche/masque les champs et le lien de bascule selon le mode courant.
    function updateFieldsForMode() {
      const isSetup = mode === 'setup';
      const isRegister = mode === 'register';
      introEl.textContent = isSetup
        ? 'Aucun compte n\'existe encore — crée le compte administrateur'
        : isRegister
          ? 'Crée ton compte (accès en lecture seule au départ)'
          : 'Connecte-toi pour accéder au site';
      emailInput.style.display = isRegister ? 'block' : 'none';
      confirmInput.style.display = (isSetup || isRegister) ? 'block' : 'none';
      turnstileContainer.style.display = isRegister ? 'flex' : 'none';
      passwordInput.setAttribute('autocomplete', (isSetup || isRegister) ? 'new-password' : 'current-password');
      btn.textContent = idleButtonText();
      if (!isSetup && registrationEnabled) {
        toggleLink.style.display = 'block';
        toggleLink.textContent = isRegister ? 'Déjà un compte ? Se connecter' : 'Pas de compte ? Crée-en un';
      } else {
        toggleLink.style.display = 'none';
      }
      if (isRegister) {
        ensureTurnstileLoaded().then(() => {
          if (turnstileWidgetId == null) {
            turnstileWidgetId = turnstile.render(turnstileContainer, { sitekey: turnstileSiteKey });
          }
        });
      }
    }

    toggleLink.addEventListener('click', () => {
      mode = mode === 'register' ? 'login' : 'register';
      errEl.textContent = '';
      form.reset();
      updateFieldsForMode();
      usernameInput.focus();
    });

    // Détermine le mode initial : connexion classique, création du tout premier
    // compte (aucun utilisateur en base), ou si l'inscription publique est ouverte
    // (Turnstile configuré côté serveur — voir /api/auth-status).
    (async () => {
      try {
        const res = await fetch('/api/auth-status');
        const status = await res.json();
        registrationEnabled = !!status.registrationEnabled;
        turnstileSiteKey = status.turnstileSiteKey || null;
        mode = status.hasUsers ? 'login' : 'setup';
      } catch (e) { /* en cas d'échec, on part du principe qu'il faut se connecter */ }
      updateFieldsForMode();
      form.style.display = 'block';
      usernameInput.focus();
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if ((mode === 'setup' || mode === 'register') && password !== confirmInput.value) {
        errEl.textContent = 'Les mots de passe ne correspondent pas.';
        return;
      }
      const body = { username, password };
      if (mode === 'register') {
        body.email = emailInput.value.trim();
        body.turnstileToken = (window.turnstile && turnstileWidgetId != null) ? turnstile.getResponse(turnstileWidgetId) : '';
        if (!body.turnstileToken) {
          errEl.textContent = 'Complète la vérification anti-robot.';
          return;
        }
      }
      const endpoint = mode === 'setup' ? '/api/setup' : mode === 'register' ? '/api/register' : '/api/login';
      btn.disabled = true;
      btn.textContent = mode === 'login' ? 'Connexion…' : 'Création…';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const j = await res.json().catch(() => ({}));
          errEl.textContent = j.error || 'Erreur.';
          btn.disabled = false;
          btn.textContent = idleButtonText();
          if (mode === 'register' && window.turnstile && turnstileWidgetId != null) turnstile.reset(turnstileWidgetId);
          return;
        }
        // redirige vers la page demandée à l'origine si connue, sinon l'accueil
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('next') || '/';
      } catch (err) {
        errEl.textContent = 'Erreur de connexion au serveur.';
        btn.disabled = false;
        btn.textContent = idleButtonText();
      }
    });
  </script>
</body>
</html>

# Build le frontend (frontend/dist) et le publie sur GitHub Pages.
#
# Ne concerne QUE le frontend statique — le backend (Express + data.json/users.json) reste
# hébergé séparément par ailleurs (GitHub Pages ne fait pas tourner de Node.js). Ce frontend
# est buildé pour appeler ce backend en cross-origin : voir la variable de repo
# API_BASE_URL ci-dessous, et CORS_ORIGIN côté backend (backend/server.js), sans laquelle
# le navigateur bloquera ces requêtes. Voir la section "Déployer le frontend sur GitHub
# Pages" du README pour la configuration complète (Pages à activer en mode "GitHub
# Actions", variable de repo à renseigner, CORS_ORIGIN côté serveur).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Fait tourner la suite de tests (backend + frontend, voir npm test à la racine) AVANT tout
  # build/publication — sans ce garde-fou, rien n'empêchait un commit cassé sur main de partir
  # en prod (ce workflow ne faisait que builder/publier, jamais npm test). Voir aussi ci.yml,
  # qui couvre les autres branches/pull requests ; ce job-ci reste le vrai verrou du
  # déploiement lui-même, dédoublé volontairement pour ne jamais dépendre d'un autre workflow.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    # Rattaché à l'environnement "github-pages" pour que ${{ vars.API_BASE_URL }} voie AUSSI
    # une variable ajoutée depuis Settings → Environments → github-pages (facile de s'y
    # tromper : cette page existe déjà dès que Pages est activé, avant même la variable de
    # repo Settings → Secrets and variables → Actions → Variables) — les deux emplacements
    # fonctionnent désormais, plus besoin de deviner lequel a été utilisé.
    environment: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      # Échoue tôt et clairement plutôt que de publier silencieusement un site cassé (appels
      # /api/* résolus en relatif contre github.io lui-même -> 404, aucun message d'erreur
      # visible dans l'app elle-même, voir main.js::init() qui reste juste sur l'écran vide
      # d'import sans erreur affichée si loadFromServer() renvoie des données vides).
      - name: Vérifie que API_BASE_URL est configurée
        run: |
          if [ -z "${{ vars.API_BASE_URL }}" ]; then
            echo "::error::La variable API_BASE_URL est vide ou absente (Settings → Secrets and variables → Actions → Variables, OU Settings → Environments → github-pages → Environment variables). Sans elle, le frontend appelle des chemins /api/* relatifs à github.io lui-même, qui n'existent pas — le site se charge mais reste vide. Voir la section 'Déployer le frontend sur GitHub Pages' du README."
            exit 1
          fi
      - run: npm run build --workspace frontend
        env:
          # URL HTTPS publique du backend (sans slash final) — variable de repo à
          # renseigner soi-même : Settings → Secrets and variables → Actions → Variables
          # → API_BASE_URL (une variable, pas un secret : c'est une URL publique).
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          # Site de PROJET GitHub Pages, servi sous /<repo>/ — à adapter si le repo est
          # renommé, ou remplacer par '/' en cas de domaine personnalisé (voir README).
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # Désactive le traitement Jekyll par défaut de GitHub Pages, qui peut ignorer ou mal
      # gérer certains fichiers générés par Vite (ex: noms commençant par un underscore).
      - run: touch frontend/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
